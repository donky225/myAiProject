apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: rag-demo
data:
  SPRING_AI_OLLAMA_BASE_URL: "http://ollama:11434"
  OPENSEARCH_BASE_URL: "http://opensearch:9200"
  OPENSEARCH_INDEX_NAME: "rag_documents"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app
  namespace: rag-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: rag-app }
  template:
    metadata:
      labels: { app: rag-app }
    spec:
      initContainers:
        - name: wait-for-opensearch
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -s http://opensearch:9200 >/dev/null; do
                echo "waiting for opensearch..."
                sleep 3
              done
        - name: wait-for-ollama
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -s http://ollama:11434 >/dev/null; do
                echo "waiting for ollama..."
                sleep 3
              done
      containers:
        - name: rag-app
          image: rag-app:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: app-config }
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rag-app
  namespace: rag-demo
spec:
  type: NodePort
  selector: { app: rag-app }
  ports:
    - { port: 8080, targetPort: 8080 }