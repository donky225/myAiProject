global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot 애플리케이션 (Micrometer → /actuator/prometheus)
  - job_name: 'spring-boot-rag'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'rag-app'

  # 리랭크 서비스 (FastAPI, prometheus-fastapi-instrumentator 사용 시)
  - job_name: 'rerank-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          service: 'rerank-service'
