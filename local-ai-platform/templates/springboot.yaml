{{- if .Values.springboot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot
  namespace: {{ .Values.global.namespace }}
  labels:
    app: springboot
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.springboot.replicas }}
  selector:
    matchLabels:
      app: springboot
  template:
    metadata:
      labels:
        app: springboot
    spec:
      # OpenSearch/pgvector/Redis/Kafka가 먼저 Ready 상태여야 하므로
      # initContainer로 DB 포트가 열릴 때까지 대기 (README.md의 @PostConstruct 이슈 재발 방지)
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: springboot
          image: "{{ .Values.springboot.image.repository }}:{{ .Values.springboot.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.springboot.containerPort }}
          envFrom:
            - configMapRef:
                name: springboot-config
            - secretRef:
                name: platform-secrets
          resources:
            {{- toYaml .Values.springboot.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.springboot.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.springboot.containerPort }}
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: springboot
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.springboot.service.type }}
  selector:
    app: springboot
  ports:
    - port: {{ .Values.springboot.service.port }}
      targetPort: {{ .Values.springboot.containerPort }}
      {{- if eq .Values.springboot.service.type "NodePort" }}
      nodePort: {{ .Values.springboot.service.nodePort }}
      {{- end }}
{{- end }}
