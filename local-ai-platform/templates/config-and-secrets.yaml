apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
data:
  # application.yml 의 값을 환경변수로 오버라이드하기 위한 설정.
  # Spring Boot의 relaxed binding 규칙(SPRING_AI_OLLAMA_BASE_URL 등)을 그대로 사용.
  SPRING_AI_OLLAMA_BASE_URL: {{ .Values.global.externalGpuServices.ollamaUrl | quote }}
  STABLE_DIFFUSION_BASE_URL: {{ .Values.global.externalGpuServices.stableDiffusionUrl | quote }}
  RERANK_SERVICE_URL: {{ .Values.global.externalGpuServices.rerankUrl | quote }}
  VOICE_SERVICE_URL: {{ .Values.global.externalGpuServices.voiceServiceUrl | quote }}

  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/{{ .Values.postgres.database }}"
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.username | quote }}

  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Spring Boot 4.x / Spring Data Redis 는 spring.redis.* 가 아니라 spring.data.redis.* 를 씀
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"

  # application.yml 의 spring.ai.vectorstore.opensearch.uris 에 대응
  SPRING_AI_VECTORSTORE_OPENSEARCH_URIS: "http://opensearch:9200"
  # application.yml 최상단 커스텀 opensearch.base-url (OpenSearchIndexInitializer 등에서 사용 추정)에 대응
  OPENSEARCH_BASE_URL: "http://opensearch:9200"

  # 참고: RAG_RELEVANCE_THRESHOLD 는 application.yml에 대응 프로퍼티가 없어 현재 앱에서 읽히지 않음.
  # 코드에서 @Value("${rag.relevance.threshold}") 같은 형태로 직접 참조하는 곳이 있다면
  # 여기 키 이름을 그 프로퍼티에 맞춰 다시 조정해야 함.
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  TAVILY_API_KEY: {{ .Values.secrets.tavilyApiKey | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.monitoring.grafana.adminPassword | quote }}
